<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Lato:wght@400;700;900&family=Press+Start+2P&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #769656; --light: #eeeed2;
    --ink: #eef1f6; --paper: #1b1f2a; --panel: #262b39; --field: #2f3546; --panel2: #313748;
    --line: #3a4154; --muted: #9aa3b8; --accent: #f5b83d; --good: #7bd35a; --bad: #ff6b5a;
    --brand: #5fbf3a; --brand-dark: #3c8526; --side: #141822;
    --serif: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--paper); color: var(--ink); }

  /* sidebar */
  #sidebar { width: 216px; background: var(--ink); color: #b9b3a5; display: flex; flex-direction: column; padding: 26px 0 18px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  #logo { font-family: var(--serif); font-size: 22px; color: #f1ede3; padding: 0 22px; letter-spacing: 0.3px; }
  #tag { font-size: 12px; color: #8d8879; padding: 3px 22px 24px; letter-spacing: 0.4px; border-bottom: 1px solid #333840; margin-bottom: 14px; }
  .nav-item { display: flex; align-items: center; gap: 13px; padding: 10px 22px; font-size: 15px; cursor: pointer; border-left: 3px solid transparent; }
  .nav-item svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: #e8e4da; }
  .nav-item.active { background: rgba(255,255,255,0.08); color: #fff; border-left-color: var(--accent); }
  .nav-item.bottom { margin-top: auto; }

  /* layout */
  #main { flex: 1; min-width: 0; display: flex; justify-content: center; align-items: center; overflow: auto; }
  #stage { display: flex; gap: 34px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 20px; }
  #app { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #boardrow { display: flex; align-items: stretch; }
  #evalbar { width: 20px; margin: 8px 10px 24px 0; border: 1px solid var(--ink); background: #1c1f24; position: relative; overflow: hidden; display: none; }
  #evalfill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: #f7f4ed; transition: height 0.3s; }
  #evalnum { position: absolute; left: 0; right: 0; font-size: 10px; font-weight: 700; text-align: center; }
  #wrap { display: grid; grid-template-columns: 24px auto; }
  #ranks { display: flex; flex-direction: column; margin-top: 8px; }
  #ranks div { height: 60px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--muted); }
  #board { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); width: 480px; box-sizing: content-box; border: 8px solid var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 6px 18px rgba(40,30,10,0.18); }
  #files { grid-row: 2; grid-column: 2; display: flex; margin-left: 8px; }
  #files div { width: 60px; height: 22px; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 4px; }
  .square { position: relative; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 46px; cursor: pointer; }
  .square.mine { cursor: grab; }
  .light { background: var(--light); }
  .dark { background: var(--dark); }
  .lastmove::before { content: ""; position: absolute; inset: 0; background: rgba(200,146,58,0.42); }
  .incheck { background: #d9604c !important; }
  .selected { background: #e6c566 !important; }
  .pc { display: block; line-height: 1; position: relative; }
  .pc svg { display: block; }
  .ghost .pc { opacity: 0.25; }
  .white-piece { color: #faf7f0; text-shadow: 0 0 1.5px #000, 0 0 1.5px #000, 0 0 1.5px #000, 0 2px 2px rgba(0,0,0,0.3); }
  .black-piece { color: #1c1f24; text-shadow: 0 1px 0 rgba(255,255,255,0.22); }
  .floating { position: fixed; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 46px; pointer-events: none; z-index: 1000; transform: scale(1.15); }
  .dot::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 17px; height: 17px; border-radius: 50%; background: var(--hint, rgba(28,31,36,0.28)); }
  .capture::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 54px; height: 54px; border-radius: 50%; border: 5px solid var(--hint, rgba(28,31,36,0.28)); }
  #status { font-size: 15px; font-weight: 600; min-height: 22px; text-align: center; max-width: 500px; color: var(--ink); }

  /* controls */
  button { font: inherit; font-size: 14px; padding: 8px 15px; cursor: pointer; background: transparent; color: var(--ink); border: 1px solid var(--ink); border-radius: 3px; }
  button:hover { background: rgba(28,31,36,0.07); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .primary { background: var(--ink); color: #f1ede3; border-color: var(--ink); }
  .primary:hover { background: #343a42; }
  .wide { width: 100%; }
  .chip { padding: 5px 12px; font-size: 13px; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 3px; }
  .chip:hover { border-color: var(--ink); background: var(--field); }
  .chip.on { background: var(--ink); color: #f1ede3; border-color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }

  /* side panel */
  .side { width: 296px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 20px 20px 22px; }
  .side h2 { margin: 0 0 6px; font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.25; }
  .side p { margin: 4px 0 12px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .note { font-size: 12.5px; color: var(--muted); margin: 6px 0 12px; line-height: 1.45; }
  input[type=range] { width: 100%; accent-color: var(--ink); }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .cell { padding: 9px 0; text-align: center; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; font-weight: 600; font-size: 14px; background: var(--field); }
  .cell:hover { border-color: var(--ink); }
  .cell.current { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .cell.done { background: var(--good); color: #fff; border-color: var(--good); }
  .movelist { height: 190px; overflow-y: auto; background: var(--field); border: 1px solid var(--line); border-radius: 3px; font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 14px; }
  .movelist:empty::before { content: "No moves yet"; color: #9a948500; color: var(--muted); display: block; padding: 10px; font-family: system-ui, sans-serif; font-size: 13px; }
  .mv { display: grid; grid-template-columns: 36px 1fr 1fr; padding: 2px 6px; }
  .mv:nth-child(odd) { background: rgba(0,0,0,0.035); }
  .mv .num { color: var(--muted); padding-left: 4px; }
  .mv span.mvb { cursor: pointer; padding: 1px 6px; border-radius: 2px; }
  .mv span.mvb:hover { background: rgba(200,146,58,0.25); }
  .mv span.cur { background: var(--ink); color: #f1ede3; }
  .bar { height: 5px; background: #d8d2c4; margin: 6px 0 10px; }
  .bar div { height: 100%; background: var(--ink); width: 0; }
  .fb { padding: 10px 12px; background: var(--field); border-left: 3px solid var(--accent); margin: 10px 0; font-size: 14px; line-height: 1.5; }
  .fb b.Best, .fb b.Good { color: var(--good); }
  .fb b.Inaccuracy { color: #a87812; }
  .fb b.Mistake, .fb b.Blunder { color: var(--bad); }
  .small { font-size: 13px; color: var(--muted); }

  /* full-page views */
  #info { display: none; padding: 38px 44px; max-width: 1020px; width: 100%; }
  #info h1 { font-family: var(--serif); font-weight: 600; font-size: 32px; margin: 0 0 6px; }
  #info > p { color: var(--muted); max-width: 620px; margin: 0 0 22px; }
  #info h3 { font-family: var(--serif); font-weight: 600; font-size: 19px; margin: 26px 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 4px; padding: 15px 16px; background: var(--panel); }
  .card.click { cursor: pointer; }
  .card.click:hover { border-color: var(--ink); }
  .card b { font-family: var(--serif); font-size: 18px; font-weight: 600; display: block; margin-bottom: 4px; }
  .card span { color: var(--muted); font-size: 13.5px; line-height: 1.45; display: block; }
  .card .badge { float: right; color: var(--good); font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; }
  .detail { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; padding: 6px 24px 20px; max-width: 700px; margin-bottom: 18px; }
  #info .detail h3 { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 18px 0 4px; }
  #info h1 .small { font-family: system-ui, sans-serif; font-weight: 500; }
  .detail p { margin: 0 0 4px; line-height: 1.6; font-size: 15.5px; }
  .vlist { display: flex; flex-direction: column; gap: 10px; max-width: 700px; }
  .vitem { border: 1px solid var(--line); border-radius: 4px; padding: 13px 18px; background: var(--panel); cursor: pointer; }
  .vitem:hover { border-color: var(--ink); }
  .vitem b { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .vitem span { display: block; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .gamerow { display: flex; justify-content: space-between; gap: 14px; align-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 13px 18px; margin-bottom: 8px; max-width: 700px; }
  .gamerow .x { border: none; color: var(--bad); font-size: 16px; padding: 4px 10px; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 14px 20px; max-width: 540px; font-size: 16px; margin-bottom: 16px; }
  .setblock { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 16px 20px 20px; max-width: 540px; font-size: 16px; }
  .setblock h4 { margin: 18px 0 0; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  #soundBtn { min-width: 70px; font-weight: 600; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0; align-items: center; }
  .sw { width: 44px; height: 44px; border-radius: 3px; border: 2px solid transparent; padding: 0; box-shadow: 0 0 0 1px var(--line); }
  .sw:hover { background-blend-mode: normal; }
  .sw.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel) inset; }
  .pwrap { position: relative; }
  .del { position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; padding: 0; border-radius: 50%; border: none; background: var(--ink); color: #fff; font-size: 13px; line-height: 18px; }
  .custom { display: flex; align-items: center; gap: 12px; font-size: 14px; margin: 8px 0; }
  .custom input { width: 48px; height: 32px; padding: 0; border: 1px solid var(--line); background: none; cursor: pointer; }
  .prev { display: grid; grid-template-columns: repeat(8, 26px); width: 208px; margin-top: 16px; border: 3px solid var(--ink); }
  .prev div { width: 26px; height: 26px; }

  /* clocks */
  .clock { width: 520px; display: none; justify-content: space-between; align-items: center; gap: 12px; padding-left: 24px; }
  .clock .cn { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clock .ct { font: 700 22px/1 ui-monospace, Consolas, Menlo, monospace; padding: 7px 12px; border-radius: 3px; background: var(--field); border: 1px solid var(--line); min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
  .clock.on .ct { background: var(--ink); color: #f1ede3; border-color: var(--ink); }
  .clock.on.low .ct { background: var(--bad); border-color: var(--bad); }

  /* online + leaderboard */
  .lb { border-collapse: collapse; width: 100%; max-width: 700px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  .lb th, .lb td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  .lb th { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .lb td.n, .lb th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lb td.rk { width: 52px; color: var(--muted); font-weight: 700; }
  .lb tr.me td { background: rgba(200,146,58,0.16); font-weight: 600; }
  .lb td.big { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .namebox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .namebox input { font: inherit; font-size: 16px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--field); width: 230px; color: var(--ink); }
  .err { color: var(--bad); font-size: 13.5px; margin-top: 8px; min-height: 18px; }
  .mecard { display: flex; justify-content: space-between; align-items: center; gap: 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 16px 20px; max-width: 700px; margin-bottom: 8px; }
  .mecard .rt { font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1; }
  .seekbox { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 16px 20px; max-width: 700px; }
  .plus { color: var(--good); font-weight: 700; } .minus { color: var(--bad); font-weight: 700; }
  #frame { position: relative; }
  .cards.hub { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); max-width: 760px; }
  .card.hubc { padding: 22px 22px 24px; }
  .card.hubc b { font-size: 22px; margin: 10px 0 6px; }
  .hubi svg { width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .clubb { display: inline-flex; flex: none; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 700; letter-spacing: 0.5px; }
  .post { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 10px 14px; margin-bottom: 8px; font-size: 14.5px; }
  .post .x { border: none; color: var(--bad); padding: 0 6px; font-size: 13px; }
  #toast { position: fixed; right: 22px; bottom: 22px; z-index: 1500; background: var(--panel); border: 1px solid var(--ink); border-left: 4px solid var(--accent); border-radius: 4px; padding: 14px 18px; max-width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); font-size: 15px; }
  .tstate { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tstate.live { color: var(--good); } .tstate.upcoming { color: #a87812; } .tstate.finished { color: var(--muted); }
  .premove { background-image: linear-gradient(rgba(214,92,70,0.55), rgba(214,92,70,0.55)); }
  .pc.set-modern, .pc.set-neon { text-shadow: none; }
  .pc.set-modern svg, .pc.set-neon svg { width: 52px; height: 52px; }
  .pc.set-modern svg { filter: drop-shadow(0 2px 1.5px rgba(0,0,0,0.28)); }
  .pc.set-neon svg { filter: drop-shadow(0 0 2px currentColor) drop-shadow(0 0 5px currentColor); }
  .pc.mated { animation: topple 0.7s cubic-bezier(.5,0,.6,1.4) forwards; transform-origin: 50% 85%; }
  @keyframes topple { to { transform: rotate(78deg) translate(4px, 6px); } }
  @media (prefers-reduced-motion: reduce) { .pc.mated { animation: none; transform: rotate(78deg); } }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 2000; }
  .pcprev { display: flex; gap: 2px; padding: 6px; border-radius: 3px; background: var(--light); }
  .pcprev .pc { width: 44px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .pcprev .pc svg { width: 42px; height: 42px; }
  .pcprev.dark { background: #2f3650; }
  #marks { position: absolute; left: 8px; top: 8px; width: 480px; height: 480px; pointer-events: none; z-index: 5; overflow: visible; }
  .hidecoords #ranks div, .hidecoords #files div { visibility: hidden; }
  #viewbar { display: none; align-items: center; }
  #viewbar .small { min-width: 140px; text-align: center; }
  .setrow2 { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .setrow2:last-child { border-bottom: none; }
  .setrow2 .small { margin-top: 2px; font-size: 13px; }
  .setblock + .setblock { margin-top: 16px; }
  .setblock h4:first-child { margin-top: 0; }
  .acol { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); }
  .acol.on { border-color: var(--panel); box-shadow: 0 0 0 2px var(--ink); }
  .hintsq { box-shadow: inset 0 0 0 4px #e6c566; }
  .hang { box-shadow: inset 0 0 0 4px rgba(176,65,46,0.9); }
  .prey { box-shadow: inset 0 0 0 4px rgba(63,125,78,0.9); }
  .hitok::before, .hitbad::before { content: ""; position: absolute; inset: 0; }
  .hitok::before { background: rgba(63,125,78,0.65); } .hitbad::before { background: rgba(176,65,46,0.65); }
  .nocoords #ranks div, .nocoords #files div { visibility: hidden; }
  .bigtarget { font-family: var(--serif); font-size: 64px; font-weight: 600; text-align: center; line-height: 1; margin: 8px 0 4px; }
  .bignum { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1; }
  .statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 760px; }
  .stat { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 12px 14px; }
  .stat .small { margin-top: 4px; }
  .mrow { display: grid; grid-template-columns: 170px 1fr 56px; gap: 12px; align-items: center; font-size: 14px; padding: 5px 0; max-width: 700px; }
  .meter { height: 8px; background: #d8d2c4; border-radius: 2px; overflow: hidden; } .meter div { height: 100%; background: var(--good); }
  .dots { display: flex; gap: 5px; margin-top: 8px; } .dots span { width: 26px; height: 26px; border-radius: 3px; background: #d8d2c4; font-size: 10px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .dots span.on { background: var(--good); color: #fff; }
  .topmv { display: flex; justify-content: space-between; width: 100%; text-align: left; margin-bottom: 5px; font-family: ui-monospace, Consolas, Menlo, monospace; }
  .chart { max-width: 700px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
  .chart svg { display: block; width: 100%; height: 150px; }
  textarea.pgn { width: 100%; height: 64px; font: 13px ui-monospace, Consolas, Menlo, monospace; border: 1px solid var(--line); background: var(--field); border-radius: 3px; padding: 6px; color: var(--ink); resize: vertical; }
  .players .pl { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  /* ===== Site themes: Fancy (default) and Arcade ===== */
  :root { --paper: #0e1714; --side: #0a110f; --panel: #13201c; --panel2: #182821; --field: #172620; --line: #3b3523;
    --ink: #efe7d6; --muted: #b3a888; --accent: #d8b766; --brand: #d8b766; --brand-dark: #8f7536; --brand-ink: #14110a;
    --good: #9bd17f; --bad: #e8806c; --tint: rgba(216,183,102,0.13); --btn: transparent; --btn-line: #5b4f2f; --btn-hover: rgba(216,183,102,0.1);
    --navtext: #cfc6b2; --navgroup: #8a7e5e; --radius: 3px; --frame: #3a2416;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif; --sans: Lato, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body.arcade { --paper: #160d2e; --side: #0e0820; --panel: #221544; --panel2: #2b1b55; --field: #1c1140; --line: #4a3384;
    --ink: #f3eaff; --muted: #b9a9e0; --accent: #ffe14d; --brand: #3ef0ff; --brand-dark: #ff4fd8; --brand-ink: #0e0820;
    --good: #7dff7a; --bad: #ff5d7a; --tint: rgba(62,240,255,0.13); --btn: #2b1b55; --btn-line: #4a3384; --btn-hover: #36226a;
    --navtext: #d9ccf5; --navgroup: #8f7fc0; --radius: 0px; --frame: #0e0820;
    --serif: "Press Start 2P", ui-monospace, monospace; --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }

  body { font-family: var(--sans); font-size: 15.5px; background: var(--paper); color: var(--ink); }

  for (const dc of [-1, 1]) if (inside(pr, c + dc) && b[pr][c + dc] === P) return true;
  for (const [dr, dc] of KNIGHT) { const rr = r + dr, cc = c + dc; if (inside(rr, cc) && b[rr][cc] === N) return true; }
  for (const [dr, dc] of KING)   { const rr = r + dr, cc = c + dc; if (inside(rr, cc) && b[rr][cc] === K) return true; }
  for (const [dr, dc] of ORTHO) {
    let rr = r + dr, cc = c + dc;
    while (inside(rr, cc)) { const x = b[rr][cc]; if (x !== ".") { if (x === R || x === Q) return true; break; } rr += dr; cc += dc; }
  }
  for (const [dr, dc] of DIAG) {
    let rr = r + dr, cc = c + dc;
    while (inside(rr, cc)) { const x = b[rr][cc]; if (x !== ".") { if (x === B || x === Q) return true; break; } rr += dr; cc += dc; }
  }
  return false;
}

// simple = skip castling and en passant (used inside the computer's search)
function pseudo(b, r, c, simple) {
  const p = b[r][c], col = colorOf(p), t = p.toLowerCase(), out = [];
  const add = (tr, tc, extra) => out.push(Object.assign({ fr: r, fc: c, tr: tr, tc: tc }, extra));
  if (t === "p") {
    const dir = col === "w" ? -1 : 1, startRow = col === "w" ? 6 : 1;
    if (inside(r + dir, c) && b[r + dir][c] === ".") {
      add(r + dir, c);
      if (r === startRow && b[r + 2 * dir][c] === ".") add(r + 2 * dir, c, { double: true });
    }
    for (const dc of [-1, 1]) {
      const tr = r + dir, tc = c + dc;
      if (!inside(tr, tc)) continue;
      if (b[tr][tc] !== "." && colorOf(b[tr][tc]) !== col) add(tr, tc);
      else if (!simple && enPassant && enPassant[0] === tr && enPassant[1] === tc) add(tr, tc, { ep: true });
    }
  } else if (t === "n" || t === "k") {
    for (const [dr, dc] of (t === "n" ? KNIGHT : KING)) {
      const tr = r + dr, tc = c + dc;
      if (inside(tr, tc) && colorOf(b[tr][tc]) !== col) add(tr, tc);
    }
    if (t === "k" && !simple) {
      const row = col === "w" ? 7 : 0, foe = col === "w" ? "b" : "w", rook = col === "w" ? "R" : "r";
      if (r === row && c === 4 && !isAttacked(b, row, 4, foe)) {
        if (castle[col + "K"] && b[row][5] === "." && b[row][6] === "." && b[row][7] === rook &&
            !isAttacked(b, row, 5, foe) && !isAttacked(b, row, 6, foe)) add(row, 6, { castle: "K" });
        if (castle[col + "Q"] && b[row][3] === "." && b[row][2] === "." && b[row][1] === "." && b[row][0] === rook &&
            !isAttacked(b, row, 3, foe) && !isAttacked(b, row, 2, foe)) add(row, 2, { castle: "Q" });
      }
    }
  } else {
    const dirs = t === "r" ? ORTHO : t === "b" ? DIAG : ORTHO.concat(DIAG);
    for (const [dr, dc] of dirs) {
      let tr = r + dr, tc = c + dc;
      while (inside(tr, tc)) {
        if (b[tr][tc] === ".") add(tr, tc);
        else { if (colorOf(b[tr][tc]) !== col) add(tr, tc); break; }
        tr += dr; tc += dc;
      }
    }
  }
  return out;
}

function applyMove(b, m) {
  const nb = b.map(row => row.slice());
  const p = nb[m.fr][m.fc];
  nb[m.fr][m.fc] = ".";
  nb[m.tr][m.tc] = p;
  if (m.ep) nb[m.fr][m.tc] = ".";
  if (m.castle === "K") { nb[m.tr][5] = nb[m.tr][7]; nb[m.tr][7] = "."; }
  if (m.castle === "Q") { nb[m.tr][3] = nb[m.tr][0]; nb[m.tr][0] = "."; }
  if (p === "P" && m.tr === 0) nb[m.tr][m.tc] = "Q";
  if (p === "p" && m.tr === 7) nb[m.tr][m.tc] = "q";
  return nb;
}

function legalMoves(r, c) {
  const col = colorOf(board[r][c]), foe = col === "w" ? "b" : "w";
  return pseudo(board, r, c).filter(m => {
    const nb = applyMove(board, m);
    const k = findKing(nb, col);
    return !isAttacked(nb, k[0], k[1], foe);
  });
}
function allLegal(col) {
  const out = [];
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if (colorOf(board[r][c]) === col) for (const m of legalMoves(r, c)) out.push(m);
  return out;
}
function hasLegalMove(col) {
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if (colorOf(board[r][c]) === col && legalMoves(r, c).length > 0) return true;
  return false;
}
function inCheckNow(col) {
  const k = findKing(board, col);
  return isAttacked(board, k[0], k[1], col === "w" ? "b" : "w");
}

const moveStr = m => FILES[m.fc] + (8 - m.fr) + FILES[m.tc] + (8 - m.tr);
function moveFromStr(s) {
  const r = 8 - +s[1], c = FILES.indexOf(s[0]);
  return legalMoves(r, c).find(m => m.tr === 8 - +s[3] && m.tc === FILES.indexOf(s[2]));
}

// Move text like e4, Nf3, Qxd5, O-O (check marks are added by suffix())
function sanOf(m) {
  if (m.castle) return m.castle === "K" ? "O-O" : "O-O-O";
  const p = board[m.fr][m.fc], t = p.toLowerCase();
  const dest = FILES[m.tc] + (8 - m.tr);
  const cap = board[m.tr][m.tc] !== "." || !!m.ep;
  if (t === "p") {
    let s = cap ? FILES[m.fc] + "x" + dest : dest;
    if (m.tr === 0 || m.tr === 7) s += "=Q";
    return s;
  }
  let s = t.toUpperCase(), other = false, sameFile = false, sameRank = false;
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if ((r !== m.fr || c !== m.fc) && board[r][c] === p &&
          legalMoves(r, c).some(x => x.tr === m.tr && x.tc === m.tc)) {
        other = true;
        if (c === m.fc) sameFile = true;
        if (r === m.fr) sameRank = true;
      }
  if (other) {
    if (!sameFile) s += FILES[m.fc];
    else if (!sameRank) s += (8 - m.fr);
    else s += FILES[m.fc] + (8 - m.fr);
  }
  return s + (cap ? "x" : "") + dest;
}

// Plays a move on the game state (no screen updates)
function makeMove(m) {
  const p = board[m.fr][m.fc];
  if (p === "K") { castle.wK = false; castle.wQ = false; }
  if (p === "k") { castle.bK = false; castle.bQ = false; }
  for (const [sr, sc] of [[m.fr, m.fc], [m.tr, m.tc]]) {
    if (sr === 7 && sc === 0) castle.wQ = false;
    if (sr === 7 && sc === 7) castle.wK = false;
    if (sr === 0 && sc === 0) castle.bQ = false;
    if (sr === 0 && sc === 7) castle.bK = false;
  }
  enPassant = m.double ? [(m.fr + m.tr) / 2, m.fc] : null;
  board = applyMove(board, m);
  turn = turn === "w" ? "b" : "w";
}
function statusNow() {
  const check = inCheckNow(turn), any = hasLegalMove(turn);
  return { check: check, mate: check && !any, stalemate: !check && !any, over: !any };
}
function suffix() { const s = statusNow(); return s.mate ? "#" : s.check ? "+" : ""; }

function moveFromSan(s) {
  s = s.replace(/[+#]/g, "");
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if (colorOf(board[r][c]) === turn)
        for (const m of legalMoves(r, c)) if (sanOf(m) === s) return m;
  return null;
}

function snapshot() {
  return { board: board.map(r => r.slice()), turn: turn, castle: Object.assign({}, castle),
           enPassant: enPassant ? enPassant.slice() : null };
}
function restore(s) {
  board = s.board.map(r => r.slice()); turn = s.turn;
  castle = Object.assign({}, s.castle); enPassant = s.enPassant ? s.enPassant.slice() : null;
}

// Replays a list of move texts from the start. Returns the board after every move.
function replay(sans) {
  setStart();
  const snaps = [snapshot()], moves = [], texts = [];
  for (const s of sans) {
    const m = moveFromSan(s);
    if (!m) break;
    const base = sanOf(m);
    moves.push({ fr: m.fr, fc: m.fc, tr: m.tr, tc: m.tc });
    makeMove(m);
    texts.push(base + suffix());
    snaps.push(snapshot());
  }
  return { snaps: snaps, moves: moves, texts: texts };
}

// ---------- Search ----------
const VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };
const MATE = 100000;
let nodes = 0, deadline = 0, timeUp = false;

function evalBoard(b) {
  let s = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = b[r][c];
      if (p === ".") continue;
      const t = p.toLowerCase(), white = p === p.toUpperCase();
      const center = 7 - (Math.abs(3.5 - r) + Math.abs(3.5 - c));
      let v = VAL[t];
      if (t === "n") v += center * 6;
      else if (t === "b") v += center * 3;
      else if (t === "q") v += center;
      else if (t === "p") v += (white ? 6 - r : r - 1) * 6 + (center > 4 ? 4 : 0);
      s += white ? v : -v;
    }
  }
  return s;
}

function genMoves(b, col) {
  const foe = col === "w" ? "b" : "w", out = [];
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (colorOf(b[r][c]) !== col) continue;
      for (const m of pseudo(b, r, c, true)) {
        const nb = applyMove(b, m);
        const k = findKing(nb, col);
        if (k && !isAttacked(nb, k[0], k[1], foe)) {
          m.nb = nb;
          const victim = b[m.tr][m.tc];
          m.score = victim !== "." ? VAL[victim.toLowerCase()] * 10 - VAL[b[r][c].toLowerCase()] : 0;
          out.push(m);
        }
      }
    }
  }
  return out;
}

// Looks only at captures until things calm down, so the score isn't fooled mid-exchange
function qsearch(b, col, alpha, beta, qd) {
  const stand = (col === "w" ? 1 : -1) * evalBoard(b);
  if (qd === 0 || timeUp) return stand;
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;
  const foe = col === "w" ? "b" : "w";
  const caps = genMoves(b, col).filter(m => b[m.tr][m.tc] !== ".");
  caps.sort((x, y) => y.score - x.score);
  for (const m of caps) {
    const s = -qsearch(m.nb, foe, -beta, -alpha, qd - 1);
    if (s >= beta) return beta;
    if (s > alpha) alpha = s;
  }
  return alpha;
}

function negamax(b, col, depth, alpha, beta) {
  if (++nodes % 512 === 0 && Date.now() > deadline) timeUp = true;
  if (timeUp) return 0;
  const foe = col === "w" ? "b" : "w";
  if (depth === 0) return qsearch(b, col, alpha, beta, 3);
  const moves = genMoves(b, col);
  if (!moves.length) {
    const k = findKing(b, col);
    return isAttacked(b, k[0], k[1], foe) ? -MATE - depth : 0;
  }
  moves.sort((x, y) => y.score - x.score);
  let best = -Infinity;
  for (const m of moves) {
    const s = -negamax(m.nb, foe, depth - 1, -beta, -alpha);
    if (s > best) best = s;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

// Scores every legal move for the side to move (from that side's point of view)
function scoreRoots(maxPlies, ms) {
  const col = turn, foe = col === "w" ? "b" : "w";
  const roots = allLegal(col);
  roots.forEach(m => { m.nb = applyMove(board, m); });
  deadline = Date.now() + ms;
  nodes = 0;
  let results = null;
  for (let pl = 1; pl <= maxPlies; pl++) {
    timeUp = false;
    const scored = [];
    for (const m of roots) {
      const s = -negamax(m.nb, foe, pl - 1, -Infinity, Infinity);
      if (timeUp) break;
      scored.push([m, s]);
    }
    if (timeUp) break;
    results = scored;
  }
  return results || roots.map(m => [m, 0]);
}

function chooseMove(elo, ms) {
  const maxPlies = elo < 700 ? 1 : elo < 1200 ? 2 : elo < 1700 ? 3 : 4;
  const noise = Math.max(0, 1900 - elo) * 0.25;
  const results = scoreRoots(maxPlies, ms || 2500);
  let bestMove = null, bestScore = -Infinity;
  for (const [m, s] of results) {
    const v = s + (Math.random() * 2 - 1) * noise;
    if (v > bestScore) { bestScore = v; bestMove = m; }
  }
  return bestMove;
}

// ---------- Game review ----------
// Looks at the position in snapshot "snap" and the move that was played there.
function analyzePly(snap, played) {
  restore(snap);
  const results = scoreRoots(3, 1000);
  let best = null, bestScore = -Infinity, playedScore = null;
  for (const [m, s] of results) {
    if (s > bestScore) { bestScore = s; best = m; }
    if (m.fr === played.fr && m.fc === played.fc && m.tr === played.tr && m.tc === played.tc) playedScore = s;
  }
  if (playedScore === null) playedScore = bestScore;
  const bestText = best ? sanOf(best) : "";
  const sign = snap.turn === "w" ? 1 : -1;
  const sameMove = best && best.fr === played.fr && best.fc === played.fc && best.tr === played.tr && best.tc === played.tc;
  return { best: bestScore * sign, played: playedScore * sign, loss: bestScore - playedScore,
           bestText: bestText, isBest: !!sameMove, bestMove: best ? { fr: best.fr, fc: best.fc, tr: best.tr, tc: best.tc } : null };
}

function rateMove(a) {
  if (a.isBest || a.loss <= 10) return "Best";
  if (a.loss <= 40) return "Good";
  if (a.loss <= 90) return "Inaccuracy";
  if (a.loss <= 200) return "Mistake";
  return "Blunder";
}

  const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1.2;

  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);

    const code = src.slice(src.indexOf("// ---------- Chess engine"), src.indexOf("// ---------- Game review")) +

    const started = performance.now();

      const wait = 500 - (performance.now() - started);   // a short human-like pause, which also leaves time to premove
      if (wait > 0) { setTimeout(() => finish(mv), wait); return; }
      if (gid !== gameId || mode !== "play" || gameOver) return;
      busy = false;

  panelEl.innerHTML = "<h2>Test: " + o.name + "</h2><div class='lbl'>" + v.name + "</div>" +

    "<div style='margin-top:10px'><button class='wide' id='backLesson'>← Back to the lesson</button></div>";
  ctrlEl.innerHTML = "<button id='tHint'>Hint</button><button id='tRetry'>Restart test</button>";

  $("tRetry").onclick = () => startTest(oi, vi);

    statusEl.textContent = "Hint: move the piece on " + moveStr(m).slice(0, 2) + ".";
  };

function updateTestBar() {
  $("tprog").textContent = "Progress: " + tst.idx + " / " + tst.toks.length + " moves · Mistakes: " + tst.mistakes;
  $("tbar").style.width = (tst.idx / tst.toks.length * 100) + "%";
}
function compReply() {
  busy = true;
  const gid = gameId;
  setTimeout(() => {
    if (gid !== gameId) return;
    doMove(moveFromSan(tst.toks[tst.idx]));
    tst.idx++;
    busy = false;
    updateTestBar();
    if (tst.idx >= tst.toks.length) passTest(); else statusEl.textContent = "Your move.";
  }, 600);
}
function testMove(m) {
  const want = tst.toks[tst.idx].replace(/[+#]/g, "");
  if (sanOf(m) !== want) {
    tst.mistakes++;
    playSound("bad");
    statusEl.textContent = "Not quite. That isn’t the move from this variation. Try again.";
    selected = null; legal = [];
    updateTestBar(); render();
    return;
  }
  doMove(m);
  tst.idx++;
  updateTestBar();
  if (tst.idx >= tst.toks.length) { passTest(); return; }
  statusEl.textContent = "Good!";
  compReply();
}
function passTest() {
  gameOver = true;
  playSound("good");
  solved.add("ot-" + tst.oi + "-" + tst.vi); saveSolved();
  celebrate(!tst.mistakes);
  statusEl.textContent = tst.mistakes ? "✓ Test passed with " + tst.mistakes + " mistake" + (tst.mistakes > 1 ? "s" : "") + "." : "✓ Perfect! Test passed with no mistakes.";
  const o = OPENINGS[tst.oi], nextVi = tst.vi + 1 < o.vars.length ? tst.vi + 1 : -1;
  $("tresult").innerHTML = "<div class='fb'>You know the <b>" + o.vars[tst.vi].name + "</b>!</div>" +
    (nextVi >= 0 ? "<button class='primary wide' id='nextVar'>Next variation: " + o.vars[nextVi].name + "</button>" : "<button class='primary wide' id='allOp'>Back to all openings</button>");
  if (nextVi >= 0) $("nextVar").onclick = () => lessonView(tst.oi, nextVi);
  else $("allOp").onclick = () => { gameId++; learnPage(); };
}

const TACTICS = [
  { name: "Fork", icon: "🍴", short: "One move attacks two targets at once.",
    what: "A fork is a single move that attacks two or more enemy pieces at the same time. Your opponent can only save one of them, so you win the other. Any piece can fork, but knights are the best at it because they jump over pieces and can’t be blocked.",
    spot: "Look for two enemy pieces (or the king and another piece) that one square attacks. A fork that includes a check is the strongest, because your opponent has to answer the check and can’t save the other piece. Undefended pieces make the best targets.",
    example: "White knight on d5, Black king on e8, Black rook on a8. White plays Nc7+, checking the king and attacking the rook. The king moves, then White plays Nxa8 and wins the rook." },
  { name: "Pin", icon: "📌", short: "A piece can’t move because something more valuable is behind it.",
    what: "A pin happens when a piece is stuck in front of a more valuable piece on the same line. If it’s pinned to the king, it’s illegal to move it (an absolute pin). If it’s pinned to something like a queen, it can move, but you’d win the piece behind it (a relative pin). Bishops, rooks and queens create pins.",
    spot: "Look for your bishop, rook or queen lined up with an enemy piece that has the king or queen directly behind it. Once a piece is pinned, attack it again. It can’t run away, so you can often win it.",
    example: "White rook on e1, White pawn on d4, Black king on e8, Black knight on e6 (protected by pawns on d7 and f7). The knight is pinned to the king. White plays d5, attacking the knight. It can’t move, so White wins it for a pawn." },
  { name: "Skewer", icon: "🍢", short: "A pin in reverse: the big piece moves, you take the one behind.",
    what: "A skewer is the opposite of a pin. You attack a valuable piece that has to move out of the way, and then you capture the less valuable piece behind it. Rooks, bishops and queens do the skewering.",
    spot: "Look for a king or queen lined up with another piece behind it. A check on the king is the most forcing version, because the king has to move.",
    example: "White rook on h1, Black king on d8, Black queen on a8. White plays Rh8+. The king has to step off the 8th rank, then White plays Rxa8 and wins the queen." },
  { name: "Discovered attack", icon: "💥", short: "Move one piece to reveal an attack from another.",
    what: "A discovered attack happens when you move a piece out of the way to reveal an attack from the piece behind it. The piece that moved can make its own threat at the same time, so you create two threats at once. A discovered check is the strongest kind, because your opponent has to answer the check.",
    spot: "Look for two of your pieces lined up (like a rook with a knight or bishop in front of it) pointing at an enemy king, queen or rook. Then look for a move by the front piece that attacks something too.",
    example: "White rook on e1, White knight on e5, Black king on e8, Black queen on d7. White plays Nxd7+. The knight takes the queen and uncovers a check from the rook, so Black has to deal with the check and White has won the queen." },
  { name: "Deflection", icon: "🎣", short: "Lure a defender away from its job.",
    what: "Deflection means forcing a defending piece to leave the job it was doing. You offer a piece, or attack the defender, so it has to move, and the piece or square it was protecting is left open.",
    spot: "Ask yourself which enemy piece is holding their position together. Then look for a capture, check or threat that drags it away. Pieces that guard the back rank or a checkmate square are common targets.",
    example: "White queen on e4, White rook on e1, Black rook on d8, Black king on g8 with pawns on f7, g7 and h7. White plays Qe8+!, a queen sacrifice. The rook on d8 has to capture, which pulls it away. Then Rxe8 is checkmate." },
  { name: "Removing the defender", icon: "🎯", short: "Take or chase away the piece that protects your target.",
    what: "Removing the defender means capturing or chasing away the piece that protects your real target. Once the guard is gone, you can take the target for free.",
    spot: "Count how many pieces attack and defend the piece you want. If a single defender is holding it up, look for a way to capture, attack or trade that defender first.",
    example: "White bishop on b5, White rook on d1, Black knight on c6, Black rook on d8, Black king on e8. The rook on d8 is defended only by the knight. White plays Bxc6+, removing the defender with check. After the king moves, Rxd8 wins the rook." },
  { name: "Back-rank mate", icon: "🧱", short: "A king trapped behind its own pawns gets mated on the last rank.",
    what: "A back-rank mate is checkmate on the first or eighth rank, usually by a rook or queen, when the king is trapped behind its own pawns. The king has no squares to run to, and nothing can block.",
    spot: "Check whether the enemy king is still behind unmoved pawns, and whether you can get a rook or queen onto an open file that reaches the back rank. Protect yourself too: make an escape square (“luft”) by moving a pawn in front of your king.",
    example: "White rook on d1, Black king on g8 with pawns on f7, g7 and h7. White plays Rd8#. The king can’t escape because its own pawns block every square." },
  { name: "Double attack", icon: "✌️", short: "Create two threats in one move.",
    what: "A double attack is any move that creates two threats at once, like attacking two pieces, or attacking a piece while threatening checkmate. Your opponent can only answer one threat.",
    spot: "Queens are great at double attacks because they cover so many squares. Look for a square where one piece hits two loose pieces, or a king and another piece.",
    example: "White queen on d1, Black king on g8, Black rook on a8. White plays Qd5+, attacking the king and the rook at the same time. The king has to move, and then the queen takes the rook." }
];

const BOOK = new Set();
OPENINGS.forEach(o => o.vars.forEach(v => {

function isBookPly(i) {   // i = number of moves played so far

}

function fmtEval(cp) {
  if (Math.abs(cp) > 50000) return cp > 0 ? "White mates" : "Black mates";
  return (cp >= 0 ? "+" : "") + (cp / 100).toFixed(1);
}
function setEvalBar(cp) {
  const fill = $("evalfill"), num = $("evalnum");
  if (cp === null || cp === undefined) { fill.style.height = "50%"; num.textContent = ""; return; }
  const pct = Math.abs(cp) > 50000 ? (cp > 0 ? 100 : 0) : 100 / (1 + Math.exp(-cp / 400));
  fill.style.height = pct + "%";
  num.textContent = Math.abs(cp) > 50000 ? "#" : (cp / 100).toFixed(1);
  num.style.top = "2px"; num.style.color = "#fff"; num.style.mixBlendMode = "difference";
}
function reviewView(id) {
  const g = loadGames().find(x => x.id === id);
  if (!g) return;
  analysisToken++;
  const rp = replay(g.moves);
  stepBoard("review", rp.snaps, rp.moves, rp.texts, g.humanColor);
  rv = { g: g };
  stp.onStep = reviewStep;
  $("evalbar").style.display = "block";
  panelEl.innerHTML = "<h2>Game review</h2><div class='small'>" + g.white + " vs " + g.black + " · " + g.result + "</div>" +
    "<div class='lbl' id='anLbl'></div><div class='bar'><div id='anBar'></div></div>" +
    "<div class='fb' id='fbBox'></div><div class='movelist' id='stepList'></div><div id='summary'></div>" +
    "<div style='margin-top:8px'><button class='wide' id='toAnl'>Open in the analysis board</button></div>" +
    "<div style='margin-top:8px'><button class='wide' id='backGames'>← All games</button></div>";
  statusEl.textContent = "The bar on the left shows who is ahead (white = White).";
  buildStepList(); stepperButtons(); goStep(0);
  $("backGames").onclick = () => { analysisToken++; gameId++; clearTimers(); gamesPage(); };
  $("toAnl").onclick = () => { analysisToken++; openAnalysis(stp.texts, stp.idx); };
  startAnalysis();
}
function startAnalysis() {
  const g = rv.g, n = stp.moves.length, token = ++analysisToken;
  if (!Array.isArray(g.analysis) || g.analysis.length > n) g.analysis = [];
  let i = g.analysis.length;
  const ui = () => {
    $("anLbl").textContent = i < n ? "Analyzing the game... " + i + " / " + n : "Analysis complete";
    $("anBar").style.width = (n ? i / n * 100 : 100) + "%";
  };
  ui();
  function step() {
    if (token !== analysisToken) return;
    if (i >= n) {
      const all = loadGames(), rec = all.find(x => x.id === g.id);
      if (rec) { rec.analysis = g.analysis; saveGames(all); }
      ui(); summarize(); reviewStep(stp.idx);
      return;
    }
    g.analysis.push(analyzePly(stp.snaps[i], stp.moves[i]));
    i++;
    restore(stp.snaps[stp.idx]);
    ui(); reviewStep(stp.idx);
    setTimeout(step, 20);
  }
  setTimeout(step, 60);
}
function reviewStep(i) {
  const an = rv.g.analysis || [];
  const book = i > 0 && isBookPly(i);
  const cp = book ? 0 : i === 0 ? (an[0] ? an[0].best : null) : (an[i - 1] ? an[i - 1].played : null);
  setEvalBar(cp);
  const box = $("fbBox");
  if (!box) return;
  if (i === 0) { box.innerHTML = "Starting position. Press ▶ or click a move to step through the game."; return; }
  const a = an[i - 1], mv = stp.texts[i - 1], num = Math.floor((i - 1) / 2) + 1, side = (i - 1) % 2 === 0 ? "White" : "Black";
  if (book) { box.innerHTML = "Move " + num + " (" + side + "): <b>" + mv + "</b> – <b class='Best'>Book move.</b><br>This is a well-known opening move."; return; }
  if (!a) { box.innerHTML = "Move " + num + " (" + side + "): <b>" + mv + "</b><br>Analyzing..."; return; }
  const rt = rateMove(a);
  const label = { Best: "Best move!", Good: "Good move.", Inaccuracy: "Inaccuracy.", Mistake: "Mistake.", Blunder: "Blunder!" }[rt];
  box.innerHTML = "Move " + num + " (" + side + "): <b>" + mv + "</b> – <b class='" + rt + "'>" + label + "</b>" +
    (a.isBest ? "" : "<br>The best move was <b>" + a.bestText + "</b>.") +
    "<br><span class='small'>Evaluation after this move: " + fmtEval(a.played) + "</span>";
}
function summarize() {
  const an = rv.g.analysis, names = ["Book", "Best", "Good", "Inaccuracy", "Mistake", "Blunder"];
  const cnt = { White: {}, Black: {} };
  an.forEach((a, k) => { const s = k % 2 === 0 ? "White" : "Black", r = isBookPly(k + 1) ? "Book" : rateMove(a); cnt[s][r] = (cnt[s][r] || 0) + 1; });
  $("summary").innerHTML = "<div class='fb'><b>Summary</b> (from a simple engine that looks about 3 moves ahead, so treat it as a guide)<br>" +
    ["White", "Black"].map(s => s + ": " + names.map(n => (cnt[s][n] || 0) + " " + n.toLowerCase()).join(", ")).join("<br>") + "</div>";
}

let coachOn = true, showThreats = false, playLog = [], hintMove = null, hintFull = false;
try { coachOn = localStorage.getItem("coachOn") !== "0"; showThreats = localStorage.getItem("threats") === "1"; } catch (e) {}
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function activeDays() { try { const a = JSON.parse(localStorage.getItem("days1") || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function markActivity() { const a = activeDays(), k = dayKey(new Date()); if (!a.includes(k)) { a.push(k); store("days1", JSON.stringify(a.slice(-400))); } }
function streak() {
  const set = new Set(activeDays()), d = new Date();
  if (!set.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bests() { try { return JSON.parse(localStorage.getItem("bests1") || "{}") || {}; } catch (e) { return {}; } }
function saveBest(kind, val) {
  const b = bests(), isNew = val > (b[kind] || 0);
  if (isNew) { b[kind] = val; store("bests1", JSON.stringify(b)); }
  markActivity();
  pushScore(kind, Math.max(val, b[kind] || 0));
  return isNew;
}
function pushScore(kind, val) {
  if (!ON.ready || !ON.me || !ON.db) return;
  const cur = ON.scores.find(s => s.id === ON.uid) || {};
  if (val <= (cur[kind] || 0) && cur.name === ON.me.name) return;
  const doc = { name: ON.me.name, rush: cur.rush || 0, coords: cur.coords || 0 };
  doc[kind] = Math.max(val, cur[kind] || 0);
  ON.db.doc("scores/" + ON.uid).set(doc).catch(() => {});
}
function pawnAttacks(b, r, c, by) {
  const pr = r + (by === "w" ? 1 : -1), P = by === "w" ? "P" : "p";
  return [-1, 1].some(dc => inside(pr, c + dc) && b[pr][c + dc] === P);
}
// true when a piece can be taken for free, or by a pawn while worth more than a pawn
function threatState(b, r, c) {
  const p = b[r][c];
  if (p === "." || p.toLowerCase() === "k") return false;
  const col = colorOf(p), foe = col === "w" ? "b" : "w";
  if (!isAttacked(b, r, c, foe)) return false;
  if (!isAttacked(b, r, c, col)) return true;
  return p.toLowerCase() !== "p" && pawnAttacks(b, r, c, foe);
}

function bestOf(results) {
  let best = null, bs = -Infinity;
  for (const [m, s] of results) if (s > bs) { bs = s; best = m; }
  return best;
}

function offerDrawPlay() {
  if (mode !== "play" || gameOver || moveHistory.length < 2) return;
  const b = $("drawPlay");
  if (opp === "friend") {
    if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Both agree? Click again"; setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = "Offer draw"; } }, 3000); return; }
    delete b.dataset.sure; b.textContent = "Offer draw";
    endPlayDraw("agreement"); return;
  }
  if (busy) return;
  const comp = humanColor === "w" ? "b" : "w";
  const res = scoreRoots(2, 600);
  const best = res.length ? Math.max(...res.map(x => x[1])) : 0;
  const compView = turn === comp ? best : -best;
  if (moveHistory.length >= 20 && compView <= 40) endPlayDraw("agreement", "The computer accepts your draw offer.");
  else { playSound("notify"); statusEl.textContent = moveHistory.length < 20 ? "The computer declines: it's too early in the game for a draw." : "The computer declines the draw. It thinks it's doing better."; }
}
function endPlayDraw(reason, text) {

  statusEl.textContent = text || DRAW_TEXT[reason];

  playSound("end");

}
function playerMove(m) {
  const coaching = coachOn && opp === "ai" && !playTc;
  const before = snapshot(), mv = { fr: m.fr, fc: m.fc, tr: m.tr, tc: m.tc };
  doMove(m);
  if (gameOver || !coaching) { afterPlayMove(); return; }
  busy = true;
  statusEl.textContent = "Coach is checking your move...";
  const gid = gameId;
  setTimeout(() => {
    if (gid !== gameId) return;
    const cur = snapshot(), a = analyzePly(before, mv);
    restore(cur);
    busy = false;
    const rt = rateMove(a), box = $("coachBox"), last = moveHistory[moveHistory.length - 1];
    const cost = a.loss > 50000 ? "It lets the computer force checkmate." : "It costs about " + (a.loss / 100).toFixed(1) + " pawns of advantage.";
    if (rt === "Mistake" || rt === "Blunder") {
      busy = true;
      statusEl.textContent = "Coach: wait! Look at that move again.";
      if (box) {
        box.innerHTML = "<div class='fb'><b class='" + rt + "'>" + (rt === "Blunder" ? "Blunder!" : "Mistake.") + "</b> " + esc(last) + ". " + cost +
          "<br>A better move was <b>" + esc(a.bestText) + "</b> (the orange arrow). Remember it for next time.<div class='btnrow' style='justify-content:flex-start;margin-top:8px'>" +
          "<button class='primary' id='cKeep'>Continue</button></div></div>";
        if (a.bestMove) { marks.arrows.push({ from: [a.bestMove.fr, a.bestMove.fc], to: [a.bestMove.tr, a.bestMove.tc], color: "#e68a00" }); drawMarks(); }
        $("cKeep").onclick = () => { box.innerHTML = ""; busy = false; afterPlayMove(); };
      }
      render();

    }

      (rt === "Inaccuracy" ? ". " + esc(a.bestText) + " was a bit better." : "") + "</div>";
    afterPlayMove();
  }, 40);
}
function takeback() {
  if (mode !== "play" || playTc || !playLog.length) return;
  gameId++; busy = false;
  let n = opp === "ai" ? (turn === humanColor ? 2 : 1) : 1;
  n = Math.min(n, playLog.length);
  let e = null;
  for (let i = 0; i < n; i++) { e = playLog.pop(); moveHistory.pop(); }
  gameSnaps.length = Math.max(1, gameSnaps.length - n); viewIdx = null;

function anlPush(m) {

function evalWords(cp) {
  if (Math.abs(cp) > 50000) return (cp > 0 ? "White" : "Black") + " has a forced checkmate.";
  const side = cp > 0 ? "White" : "Black", a = Math.abs(cp);

}
function anlEval() {

  if (st.over) {
    $("anlEval").innerHTML = st.mate ? "<b>Checkmate.</b> " + (turn === "w" ? "Black" : "White") + " wins." : "<b>Stalemate.</b> It's a draw.";
    $("anlTop").innerHTML = "";

  }
  $("anlEval").innerHTML = "<span class='small'>Engine is thinking...</span>";
  setTimeout(() => {

    const sign = turn === "w" ? 1 : -1;
    const res = scoreRoots(3, 900).slice().sort((x, y) => y[1] - x[1]);
    if (token !== anl.token) return;
    const cp = res.length ? res[0][1] * sign : 0;

    $("anlEval").innerHTML = "<b>" + fmtEval(cp) + "</b> · " + evalWords(cp) + "<div class='small'>A simple engine looking about 3 moves ahead, so treat it as a guide.</div>";
    $("anlTop").innerHTML = "<div class='lbl'>Top moves</div>" + res.slice(0, 3).map(([m, s], k) =>
      "<button class='topmv' data-k='" + k + "'><span>" + (k + 1) + ". " + esc(sanOf(m)) + "</span><span>" + fmtEval(s * sign) + "</span></button>").join("");
    $("anlTop").querySelectorAll(".topmv").forEach(b => b.onclick = () => analysisMove(res[+b.dataset.k][0]));
  }, 60);

function openingName(texts) {
  const t = texts.map(s => s.replace(/[+#]/g, ""));
  let best = null, bestLen = 0;
  OPENINGS.forEach(o => o.vars.forEach(v => {
    const vt = v.moves.split(" ").map(s => s.replace(/[+#]/g, ""));
    let k = 0;
    while (k < t.length && k < vt.length && t[k] === vt[k]) k++;
    if (k > bestLen) { bestLen = k; best = { o: o, v: v }; }
  }));
  if (!best || bestLen < 2) return "";
  return best.o.name + (bestLen >= 5 ? " – " + best.v.name : "") + (t.length > bestLen ? " (left the known moves after move " + Math.ceil(bestLen / 2) + ")" : "");
}

function coNext() {
  let t;

  co.target = t; $("coT").textContent = t;
}
function coordClick(r, c) {

}
function coTick() {
  if (!co) return;
  const left = co.end - performance.now();

  if (left > 0) { $("coL").textContent = (left / 1000).toFixed(1); return; }
  clearInterval(coTimer); coTimer = null;
  co.running = false;
  $("wrap").classList.remove("nocoords");
  const score = co.score, isNew = saveBest("coords", score);
  if (isNew && score) celebrate(true);
  const acc = score + co.miss ? Math.round(score / (score + co.miss) * 100) : 0;
  panelEl.innerHTML = "<h2>Time’s up!</h2><div class='bignum'>" + score + "</div><div class='small'>squares · " + acc + "% accurate" + (isNew ? " · new best!" : " · best " + (bests().coords || 0)) + "</div>" +
    "<p style='margin-top:12px'>Tip: say the square out loud as you look at it. Practicing as Black too helps when you play the black pieces.</p>" +

// ---------- Training: Puzzle Rush ----------
let rush = null, rushTimer = null;
const RUSH_POOL = (() => {
  const out = [];
  SECTIONS.forEach(s => s.list.forEach(x => { const parts = x.split("|"); out.push({ fen: parts[0], lines: [parts[1].split(" ")], elo: s.elo, goal: "Mate in " + s.n + "." }); }));
  Object.keys(TPUZ).forEach(k => TPUZ[k].forEach(p => out.push({ fen: p.fen, lines: p.lines.map(l => l.split(" ")), elo: 800, goal: k + ": " + p.goal })));
  return out;
})();
function rushStart() {
  gameId++; clearTimers(); stopTraining();
  const bands = [...new Set(RUSH_POOL.map(p => p.elo))].sort((a, b) => a - b), seq = [];
  for (const e of bands) {
    const group = RUSH_POOL.filter(p => p.elo === e).sort(() => Math.random() - 0.5);
    seq.push(...group.slice(0, e <= 200 ? 6 : group.length));
  }
  rush = { seq: seq, i: 0, score: 0, strikes: 0, end: performance.now() + 180000, running: true };
  rushTimer = setInterval(rushTick, 200);
  rushNext();
}
function rushNext() {
  if (!rush || !rush.running) return;
  const p = rush.seq[rush.i++];
  if (!p) { rushFinish("You solved every puzzle we have!"); return; }
  startPuz({ fen: p.fen, lines: p.lines, key: "rush", kind: "rush", title: "Puzzle Rush", goal: "White to move. " + p.goal,
    hasNext: () => false, next: () => {}, restart: () => {}, panel: rushPanel, onWrong: rushWrong, onSolved: rushSolved });
}
function rushPanel() {
  panelEl.innerHTML = "<h2>Puzzle Rush</h2><p id='rushGoal'></p><div class='btnrow' style='justify-content:space-between;align-items:flex-end'>" +
    "<div><div class='small'>Solved</div><div class='bignum' id='rushS'></div></div><div style='text-align:right'><div class='small'>Time left</div><div class='bignum' id='rushT'></div></div></div>" +
    "<div class='lbl'>Strikes</div><div id='rushX' style='font-size:22px;color:var(--bad);letter-spacing:4px'></div>" +
    "<div style='margin-top:14px'><button class='wide' id='rushEnd'>End run</button></div>";
  ctrlEl.innerHTML = "";
  $("rushGoal").textContent = pz.goal;
  $("rushEnd").onclick = () => rushFinish("You ended the run.");
  rushHud();
}
function rushHud() {
  if (!rush || !$("rushS")) return;
  const left = Math.max(0, rush.end - performance.now()), s = Math.ceil(left / 1000);
  $("rushS").textContent = rush.score;
  $("rushT").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  $("rushX").textContent = "✗".repeat(rush.strikes) + "·".repeat(3 - rush.strikes);
}
function rushTick() { if (!rush) return; rushHud(); if (rush.running && rush.end - performance.now() <= 0) rushFinish("Time’s up!"); }
function rushWrong() {
  rush.strikes++; rushHud();
  playSound("bad");
  busy = true; selected = null; legal = [];
  const solution = (pz.line || pz.lines[0])[pz.step];
  statusEl.textContent = "✗ Not that one. The answer started with the piece on " + solution.slice(0, 2) + ".";
  render();

  const gid = gameId;

}
function rushSolved() {
  rush.score++; rushHud();
  statusEl.textContent = "✓ Solved!";
  const gid = gameId;
  setTimeout(() => { if (gid === gameId) rushNext(); }, 400);
}
function rushFinish(why) {
  if (!rush || !rush.running) return;
  rush.running = false;
  if (rushTimer) { clearInterval(rushTimer); rushTimer = null; }
  gameId++; gameOver = true; busy = false;
  const score = rush.score, isNew = saveBest("rush", score);
  if (isNew && score) celebrate(true);
  panelEl.innerHTML = "<h2>" + esc(why) + "</h2><div class='bignum'>" + score + "</div><div class='small'>puzzles solved" + (isNew ? " · new best!" : " · best " + (bests().rush || 0)) + "</div>" +
    "<p style='margin-top:12px'>Tip: before you move, look at every check and every capture. Most puzzles start with one of them.</p>" +
    "<button class='primary wide' id='rushAgain'>Play again</button><div style='margin-top:8px'><button class='wide' id='rushBack'>← Back to Training</button></div>";
  ctrlEl.innerHTML = "";
  $("rushAgain").onclick = rushStart; $("rushBack").onclick = backToTraining;

// ---------- Training: endgame drills ----------
let dr = null;
const countPieces = (pred) => { let n = 0; for (const row of board) for (const p of row) if (pred(p)) n++; return n; };
function drillStart(i) {
  gameId++; clearTimers(); stopTraining();
  const d = DRILLS[i];
  boardView(true); mode = "drill";
  setFen(d.fen);
  lastMove = null; moveHistory = []; selected = null; legal = []; checkSq = null; hintMove = null;
  gameOver = false; busy = false; flipped = false;
  dr = { i: i, d: d, moves: 0, whiteMat: countPieces(p => p !== "." && p !== "K" && p === p.toUpperCase() && p !== "P") };
  panelEl.innerHTML = "<h2>" + d.name + "</h2><p>" + d.goal + "</p><div class='detail' style='padding:4px 16px 12px;margin:0 0 10px'><h3 style='font-family:system-ui;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px'>How to do it</h3><p style='font-size:14px;line-height:1.5'>" + d.tips + "</p></div>" +
    "<div class='lbl' id='drCount'></div><div class='bar'><div id='drBar'></div></div><div id='drMsg'></div>" +
    "<div style='margin-top:8px'><button class='wide' id='drBack'>← Back to Training</button></div>";
  ctrlEl.innerHTML = "<button id='drHint'>Hint</button><button id='drRestart'>Restart</button>";
  $("drBack").onclick = backToTraining;
  $("drRestart").onclick = () => drillStart(i);
  $("drHint").onclick = () => {
    if (!canPlayerMove()) return;
    const m = bestOf(scoreRoots(3, 900));
    if (m) { hintMove = { fr: m.fr, fc: m.fc, tr: m.tr, tc: m.tc }; hintFull = true; statusEl.textContent = "Hint: " + sanOf(m) + "."; render(); }
  };
  resetViewHistory();
  drillHud();
  statusEl.textContent = "White to move.";
  render();
}
function drillHud() {
  if (!dr || !$("drCount")) return;
  $("drCount").textContent = "Moves used: " + dr.moves + " / " + dr.d.limit;
  $("drBar").style.width = Math.min(100, dr.moves / dr.d.limit * 100) + "%";
}
function drillEnd(win, msg) {
  gameOver = true; busy = false;
  if (win) { solved.add("eg-" + dr.i); saveSolved(); playSound("good"); celebrate(true); } else playSound("bad");
  statusEl.textContent = (win ? "✓ " : "✗ ") + msg;
  $("drMsg").innerHTML = "<div class='fb'><b class='" + (win ? "Best" : "Blunder") + "'>" + (win ? "Well done!" : "Not this time.") + "</b> " + esc(msg) + "</div>" +
    (win && dr.i + 1 < DRILLS.length ? "<button class='primary wide' id='drNext'>Next drill: " + DRILLS[dr.i + 1].name + "</button>" : "<button class='primary wide' id='drAgain'>Try again</button>");
  if ($("drNext")) { const n = dr.i + 1; $("drNext").onclick = () => drillStart(n); }
  if ($("drAgain")) { const n = dr.i; $("drAgain").onclick = () => drillStart(n); }
  render();
  return true;
}
function drillCheck() {
  const d = dr.d, st = statusNow();
  if (d.type === "mate") {
    if (st.mate && turn === "b") return drillEnd(true, "Checkmate in " + dr.moves + " moves.");
    if (st.stalemate) return drillEnd(false, "Stalemate. The king had no legal move but wasn’t in check. Leave it a square next time.");
    if (countPieces(p => p !== "." && p !== "K" && p === p.toUpperCase()) < dr.whiteMat) return drillEnd(false, "Your piece was captured. Keep it protected or far from the enemy king.");
    if (drawReason() === "repetition") return drillEnd(false, "Draw by repetition: the same position came up three times. Keep pushing the king back instead of shuffling.");
  }
  if (d.type === "promote") {
    if (countPieces(p => p === "Q") > 0) {
      let qr = -1, qc = -1;
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (board[r][c] === "Q") { qr = r; qc = c; }
      if (!isAttacked(board, qr, qc, "b") || isAttacked(board, qr, qc, "w")) return drillEnd(true, "Your pawn became a queen in " + dr.moves + " moves.");
      return drillEnd(false, "Your new queen can be captured. Bring your king to protect the promotion square first.");
    }
    if (countPieces(p => p === "P") === 0) return drillEnd(false, "The pawn was captured. Keep your king next to it.");
    if (st.stalemate) return drillEnd(false, "Stalemate. Watch out for leaving Black with no moves.");
  }
  if (d.type === "capture") {
    if (countPieces(p => p === "q") > 0) return drillEnd(false, "The pawn became a queen. Your king needs to get inside the pawn’s square sooner.");
    if (countPieces(p => p === "p") === 0) return drillEnd(true, "You caught the pawn.");
  }
  if (turn === "w" && dr.moves >= d.limit) return drillEnd(false, "You used all " + d.limit + " moves.");
  return false;
}
function drillMove(m) {
  doMove(m);
  dr.moves++; drillHud();
  if (drillCheck()) return;
  busy = true;
  statusEl.textContent = "Black is thinking...";
  const gid = gameId;
  setTimeout(() => {
    if (gid !== gameId) return;
    const res = scoreRoots(3, 700);
    let best = null, bs = -Infinity;
    for (const [mv, s] of res) {   // defend like a person: keep the king near the center
      const king = board[mv.fr][mv.fc] === "k";
      const bonus = dr.d.type === "mate" && king ? (7 - (Math.abs(3.5 - mv.tr) + Math.abs(3.5 - mv.tc))) * 8 : 0;
      const v = s + bonus + Math.random() * 3;
      if (v > bs) { bs = v; best = mv; }
    }
    busy = false;
    if (best) doMove(best);
    if (!drillCheck()) statusEl.textContent = "White to move." + (checkSq ? " Check!" : "");
  }, 350);
}

    "<div class='stat'><div class='bignum'>" + (b.rush || 0) + "</div><div class='small'>Puzzle Rush best</div></div>" +
    "<div class='stat'><div class='bignum'>" + (b.coords || 0) + "</div><div class='small'>Coordinates best</div></div>" +
    "<div class='stat'><div class='bignum'>" + cw + "–" + cl + "–" + cd + "</div><div class='small'>vs computer (W–L–D)</div></div>" +

// ---------- Online play, ratings and leaderboard ----------
// Shared data: players/<id> {name, elo, wins, losses, draws, games, rated[]}, names/<lowercase> {uid},
// seeks/<id> {uid, name, elo, tc, created, gameId}, games/<gid> {white, black, moves[], wTime, bTime, status, ...}
const START_ELO = 100, K = 32, SEEK_FRESH = 120000, TCS = [1, 5, 10];
const ON = { db: null, user: null, uid: null, me: null, ready: false, err: "", readOnly: false,
  players: [], seeks: [], scores: [], clubs: [], members: [], tours: [], entries: [], dismissed: new Set(), seekTo: "", seekTour: "", seeking: 0, mySeekUnsub: null, beat: null, joining: "",
  gid: "", g: null, color: "w", gameUnsub: null, lastLen: -1, flagSent: "", doneGid: "", delta: {},
  activeGid: "", ratingBusy: new Set(), wq: Promise.resolve(), pq: Promise.resolve(), pendingTimer: null };
let onlineTc = 5, currentView = "puzzles";

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
function eloDelta(my, opp, score) { return Math.round(K * (score - 1 / (1 + Math.pow(10, (opp - my) / 400)))); }
const signed = d => (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d);
const freshSeeks = () => ON.seeks.filter(s => !s.gameId && Date.now() - (s.created || 0) < SEEK_FRESH && TCS.includes(s.tc));

// Where shared data lives: Claude's built-in storage on claude.ai, or Firebase when the page is hosted elsewhere (e.g. GitHub Pages).
async function getBackend() {
  if (typeof claude !== "undefined" && claude.use) {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);

  if (ON.doneGid !== ON.gid && g.reason !== "abort") {
    ON.doneGid = ON.gid;
    if (["resign", "timeout", "agreement"].includes(g.reason)) playSound("end");
    if (youWin) celebrate(true);

    if (g.tour) recordTour(ON.gid, g).catch(() => {});
  }
}
function saveOnlineLocal(g) {
  const all = loadGames();
  if (all.some(x => x.gid === ON.gid)) return;
  all.unshift({ id: Date.now(), gid: ON.gid, date: new Date().toLocaleDateString(), result: g.result, moves: g.moves.slice(),
    white: g.wName + " (" + g.wElo + ")", black: g.bName + " (" + g.bElo + ")", humanColor: ON.color });

}

  if (g.status === "active" && g.drawOffer && g.drawOffer !== ON.color)

      tourState(tr) === "live" ? "<button class='primary wide' id='onTourNext'>Next tournament game</button>" : "<button class='primary wide' id='onTourSee'>See the final standings</button>");
  }

  if ($("drNo")) $("drNo").onclick = () => writeGame({ drawOffer: "" });

  if ($("onTourSee")) $("onTourSee").onclick = () => { const tid = g.tour; show("tournaments"); tourPage(tid); };
  if ($("onAnl")) $("onAnl").onclick = () => { const t = moveHistory.slice(); leaveGameWatch(); openAnalysis(t, t.length); };
  const act = g.status === "active", early = g.moves.length < 2 && g.status !== "over";
  $("onResign").style.display = act && !early ? "" : "none";

const clubInitials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const clubBadge = (c, size) => "<span class='clubb' style='background:" + (CLUB_COLORS.includes(c.color) ? c.color : CLUB_COLORS[0]) + ";width:" + size + "px;height:" + size + "px;font-size:" + Math.round(size * 0.38) + "px'>" + esc(clubInitials(c.name)) + "</span>";
const myClubIds = () => { const m = ON.members.find(x => x.id === ON.uid); return m && Array.isArray(m.clubs) ? m.clubs : []; };
const clubMembers = cid => ON.members.filter(m => Array.isArray(m.clubs) && m.clubs.includes(cid));
let clubView = { cid: "", postsUnsub: null, posts: [], tc: 5 };
function needOnline(title) {
  let h = "<h1>" + title + "</h1>";
  if (ON.err) { infoEl.innerHTML = h + "<div class='seekbox'>" + esc(ON.err) + "</div>"; return true; }
  if (!ON.ready) { infoEl.innerHTML = h + "<div class='seekbox small'>Connecting to the online server...</div>"; return true; }
  if (!ON.me) {
    infoEl.innerHTML = h + "<div class='seekbox'>Pick a username first, then come back here.<div style='margin-top:10px'><button class='primary' id='goName'>Choose a username</button></div></div>";
    $("goName").onclick = () => show("online");
    return true;
  }
  return false;
}
function clubsPage() {
  boardView(false); mode = "clubs";
  if (clubView.postsUnsub) { clubView.postsUnsub(); clubView.postsUnsub = null; }
  clubView.cid = "";
  if (needOnline("Clubs")) return;
  const mine = myClubIds(), all = ON.clubs.slice().sort((a, b) => clubMembers(b.id).length - clubMembers(a.id).length);
  const card = c => "<div class='card click' data-club='" + esc(c.id) + "'><div style='display:flex;gap:12px;align-items:center'>" + clubBadge(c, 44) +
    "<div><b style='margin:0'>" + esc(c.name) + "</b><span>" + clubMembers(c.id).length + (clubMembers(c.id).length === 1 ? " member" : " members") + "</span></div></div>" + (c.desc ? "<span style='margin-top:8px'>" + esc(c.desc) + "</span>" : "") + "</div>";
  infoEl.innerHTML = "<h1>Clubs</h1><p>Join a club to play its members, chat on its wall and enter its tournaments, or start your own.</p>" +
    "<h3>Your clubs</h3>" + (mine.length ? "<div class='cards'>" + all.filter(c => mine.includes(c.id)).map(card).join("") + "</div>" : "<p class='small'>You haven't joined a club yet.</p>") +
    "<h3>Start a club</h3><div class='seekbox'><form id='clubForm'><div class='namebox'><input id='clubName' maxlength='30' placeholder='Club name' autocomplete='off'></div>" +
    "<div class='namebox' style='margin-top:8px'><input id='clubDesc' maxlength='140' placeholder='What is your club about? (optional)' style='width:100%'></div>" +
    "<div class='lbl'>Color</div><div class='swatches' style='margin:4px 0 10px'>" + CLUB_COLORS.map((c, i) => "<button type='button' class='acol" + (i === 0 ? " on" : "") + "' data-c='" + c + "' style='background:" + c + "'></button>").join("") + "</div>" +
    "<button class='primary'>Create club</button><div class='err' id='clubErr'></div></form></div>" +
    "<h3>Find a club</h3><div class='namebox' style='margin-bottom:10px'><input id='clubSearch' placeholder='Search clubs' autocomplete='off'></div><div class='cards' id='clubList'></div>";
  let color = CLUB_COLORS[0];
  infoEl.querySelectorAll("#clubForm .acol").forEach(b => b.onclick = () => { color = b.dataset.c; infoEl.querySelectorAll("#clubForm .acol").forEach(x => x.classList.toggle("on", x === b)); });
  const drawList = () => {
    const q = ($("clubSearch").value || "").toLowerCase(), list = all.filter(c => !mine.includes(c.id) && (!q || c.name.toLowerCase().includes(q) || (c.desc || "").toLowerCase().includes(q)));
    $("clubList").innerHTML = list.length ? list.map(card).join("") : "<p class='small'>" + (all.length ? "No clubs match." : "No clubs yet. Start the first one!") + "</p>";
    $("clubList").querySelectorAll("[data-club]").forEach(x => x.onclick = () => clubPage(x.dataset.club));
  };
  $("clubSearch").oninput = drawList;
  drawList();
  infoEl.querySelectorAll(".cards [data-club]").forEach(x => x.onclick = () => clubPage(x.dataset.club));
  $("clubForm").onsubmit = async e => {
    e.preventDefault();
    const name = $("clubName").value.trim(), desc = $("clubDesc").value.trim();
    if (name.length < 3) { $("clubErr").textContent = "Give your club a name of at least 3 characters."; return; }
    if (ON.clubs.some(c => c.name.toLowerCase() === name.toLowerCase())) { $("clubErr").textContent = "A club with that name already exists."; return; }
    if (mine.length >= 10) { $("clubErr").textContent = "You can be in up to 10 clubs."; return; }
    $("clubErr").textContent = "Creating...";
    try {
      const cid = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const club = { name: name, desc: desc, color: color, owner: ON.uid, ownerName: ON.me.name, created: Date.now() };
      await ON.db.doc("clubs/" + cid).set(club);
      if (!ON.clubs.some(c => c.id === cid)) ON.clubs.push(Object.assign({ id: cid }, club));
      await setMyClubs(mine.concat(cid));

async function setMyClubs(ids) {
  const doc = { name: ON.me.name, clubs: [...new Set(ids)].slice(0, 10) };
  await ON.db.doc("clubmembers/" + ON.uid).set(doc);
  const i = ON.members.findIndex(m => m.id === ON.uid);
  if (i >= 0) ON.members[i] = Object.assign({ id: ON.uid }, doc); else ON.members.push(Object.assign({ id: ON.uid }, doc));
}

  const now = Date.now(), tours = ON.tours.filter(t => t.club === cid && t.start + t.mins * 60000 > now - 86400000);
  infoEl.innerHTML = "<button id='backClubs'>← All clubs</button>" +
    "<div style='display:flex;gap:16px;align-items:center;margin:16px 0 6px'>" + clubBadge(c, 64) + "<div><h1 style='margin:0'>" + esc(c.name) + "</h1>" +
    "<div class='small'>" + ms.length + (ms.length === 1 ? " member" : " members") + " · started by " + esc(c.ownerName || "someone") + "</div></div></div>" +
    (c.desc ? "<p>" + esc(c.desc) + "</p>" : "") +
    "<div class='btnrow' style='justify-content:flex-start;margin-bottom:6px'>" + (member ? (owner ? "" : "<button id='leaveClub'>Leave club</button>") : "<button class='primary' id='joinClub'>Join club</button>") +
    (owner || ON.admin ? "<button id='delClub'>Delete club</button>" : "") + "</div><div class='err' id='clubErr'></div>" +
    "<h3>Members</h3><div class='small' style='margin-bottom:6px'>Challenge a member to a game: <span class='chips' style='display:inline-flex;margin:0 0 0 6px'>" +
    TCS.map(t => "<button class='chip clTc" + (t === clubView.tc ? " on" : "") + "' data-tc='" + t + "'>" + t + " min</button>").join("") + "</span></div>" +
    "<table class='lb'><thead><tr><th>#</th><th>Player</th><th class='n'>Elo</th><th></th></tr></thead><tbody>" +
    ms.map((m, i) => "<tr class='" + (m.id === ON.uid ? "me" : "") + "'><td class='rk'>" + (i + 1) + "</td><td>" + esc(m.name) + (m.id === c.owner ? " <span class='small'>(founder)</span>" : "") +
      "</td><td class='n big'>" + esc(m.elo) + "</td><td class='n'>" + (m.id === ON.uid || !member ? "" : "<button data-ch='" + esc(m.id) + "'>Challenge</button>") + "</td></tr>").join("") + "</tbody></table>" +
    "<h3>Club tournaments</h3>" + (tours.length ? tours.map(tourRow).join("") : "<p class='small'>No club tournaments right now.</p>") +
    (member ? "<button id='newClubTour'>Create a club tournament</button>" : "") +
    "<h3>Club wall</h3>" + (member ? "<form class='namebox' id='postForm' style='max-width:700px'><input id='postIn' maxlength='300' placeholder='Say something to the club' style='flex:1' autocomplete='off'><button class='primary'>Post</button></form>" : "<p class='small'>Join the club to post on its wall.</p>") +

  $("backClubs").onclick = clubsPage;

  if ($("delClub")) $("delClub").onclick = async () => {
    const b = $("delClub");

    try { await ON.db.doc("clubs/" + cid).delete(); await setMyClubs(myClubIds().filter(x => x !== cid)); ON.clubs = ON.clubs.filter(x => x.id !== cid); clubsPage(); } catch (e) { $("clubErr").textContent = "Couldn't delete the club."; }
  };
  infoEl.querySelectorAll(".clTc").forEach(b => b.onclick = () => { clubView.tc = +b.dataset.tc; infoEl.querySelectorAll(".clTc").forEach(x => x.classList.toggle("on", x === b)); });
  infoEl.querySelectorAll("[data-ch]").forEach(b => b.onclick = async () => {

  infoEl.querySelectorAll("[data-tour]").forEach(x => x.onclick = () => { navTo("tournaments"); tourPage(x.dataset.tour); });
  if ($("newClubTour")) $("newClubTour").onclick = () => { navTo("tournaments"); toursPage(cid); };
  if ($("postForm")) $("postForm").onsubmit = async e => {
    e.preventDefault();
    const text = $("postIn").value.trim();
    if (!text) return;
    $("postIn").value = "";
    try { await ON.db.collection("clubs/" + cid + "/posts").add({ uid: ON.uid, name: ON.me.name, text: text.slice(0, 300), at: Date.now() }); } catch (x) { $("clubErr").textContent = "Couldn't post that."; }
  };
  drawWall();
}
function drawWall() {
  const el = $("wall");
  if (!el) return;
  const ago = t => { const s = Math.max(1, Math.round((Date.now() - t) / 1000)); return s < 60 ? s + "s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
  el.innerHTML = clubView.posts.length ? clubView.posts.map(p => "<div class='post'><div><b>" + esc(p.name) + "</b> <span class='small'>" + ago(p.at || 0) + "</span>" +
    (p.uid === ON.uid || ON.admin ? " <button class='x' data-del='" + esc(p.id) + "' title='Delete'>✕</button>" : "") + "</div><div>" + esc(p.text) + "</div></div>").join("") : "<p class='small'>No posts yet.</p>";
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => ON.db.doc("clubs/" + clubView.cid + "/posts/" + b.dataset.del).delete().catch(() => {}));
}

// ---------- Tournaments (arena: play as many games as you can while it runs) ----------
let tourTimer = null, tourCur = "";
const tourEnd = t => t.start + t.mins * 60000;
const tourState = t => Date.now() < t.start ? "upcoming" : Date.now() < tourEnd(t) ? "live" : "finished";
const tourEntries = tid => ON.entries.filter(e => Array.isArray(e.tids) && e.tids.includes(tid)).map(e => Object.assign({ id: e.id, name: e.name }, { score: 0, played: 0, w: 0, d: 0, l: 0 }, (e.e || {})[tid]))
  .sort((a, b) => b.score - a.score || b.w - a.w || a.played - b.played);
function fmtLeft(ms) { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }
function tourRow(t) {
  const st = tourState(t), n = tourEntries(t.id).length;
  const when = st === "upcoming" ? "starts in " + fmtLeft(t.start - Date.now()) : st === "live" ? "live · " + fmtLeft(tourEnd(t) - Date.now()) + " left" : "finished";
  return "<div class='gamerow click' data-tour='" + esc(t.id) + "' style='cursor:pointer'><div><b>" + esc(t.name) + "</b>" + (t.clubName ? " <span class='small'>· " + esc(t.clubName) + "</span>" : "") +
    "<div class='small'>" + esc(t.tc) + " min games · " + esc(t.mins) + " minutes · " + n + " players</div></div><span class='tstate " + st + "'>" + when + "</span></div>";
}
function stopTourTimer() { if (tourTimer) { clearInterval(tourTimer); tourTimer = null; } }
function toursPage(clubPreset) {
  boardView(false); mode = "tours"; tourCur = ""; stopTourTimer();
  if (needOnline("Tournaments")) return;
  const now = Date.now(), list = ON.tours.slice();
  const live = list.filter(t => tourState(t) === "live"), up = list.filter(t => tourState(t) === "upcoming").sort((a, b) => a.start - b.start);
  const done = list.filter(t => tourState(t) === "finished" && now - tourEnd(t) < 7 * 86400000).sort((a, b) => tourEnd(b) - tourEnd(a)).slice(0, 10);
  const mine = ON.clubs.filter(c => myClubIds().includes(c.id));
  const chips = (cls, opts, on) => "<div class='chips'>" + opts.map(o => "<button type='button' class='chip " + cls + (o[0] === on ? " on" : "") + "' data-v='" + o[0] + "'>" + o[1] + "</button>").join("") + "</div>";
  infoEl.innerHTML = "<button id='backHub'>← Play menu</button><h1 style='margin-top:14px'>Tournaments</h1>" +
    "<p>Arena tournaments: while one is running, press <b>Find my next game</b> to play another entrant. A win is 1 point and a draw is ½. Most points when time runs out wins. Games are rated.</p>" +
    "<h3>Live now</h3>" + (live.length ? live.map(tourRow).join("") : "<p class='small'>Nothing running right now.</p>") +
    "<h3>Coming up</h3>" + (up.length ? up.map(tourRow).join("") : "<p class='small'>No tournaments scheduled. Create one below.</p>") +
    "<h3>Create a tournament</h3><div class='seekbox'><form id='tourForm'>" +
    "<div class='namebox'><input id='tourName' maxlength='40' placeholder='Tournament name' autocomplete='off' value='" + esc(clubPreset ? (ON.clubs.find(c => c.id === clubPreset) || {}).name + " Arena" : ON.me.name + "'s Arena") + "'></div>" +
    "<div class='lbl'>Game length</div>" + chips("tTc", TCS.map(t => [t, t + " min"]), 5) +
    "<div class='lbl'>Tournament length</div>" + chips("tLen", [[15, "15 min"], [30, "30 min"], [60, "1 hour"]], 30) +
    "<div class='lbl'>Starts</div>" + chips("tStart", [[1, "In 1 minute"], [5, "In 5 minutes"], [15, "In 15 minutes"], [60, "In 1 hour"]], 5) +
    "<div class='lbl'>For</div>" + chips("tClub", [["", "Everyone"]].concat(mine.map(c => [c.id, c.name])), clubPreset || "") +
    "<button class='primary' style='margin-top:6px'>Create tournament</button><div class='err' id='tourErr'></div></form></div>" +
    "<h3>Recently finished</h3>" + (done.length ? done.map(tourRow).join("") : "<p class='small'>None yet.</p>");
  const pickVal = cls => { const b = infoEl.querySelector("." + cls + ".on"); return b ? b.dataset.v : ""; };
  ["tTc", "tLen", "tStart", "tClub"].forEach(cls => infoEl.querySelectorAll("." + cls).forEach(b => b.onclick = () => infoEl.querySelectorAll("." + cls).forEach(x => x.classList.toggle("on", x === b))));
  $("backHub").onclick = () => show("play");
  infoEl.querySelectorAll("[data-tour]").forEach(x => x.onclick = () => tourPage(x.dataset.tour));
  $("tourForm").onsubmit = async e => {
    e.preventDefault();
    const name = $("tourName").value.trim();
    if (name.length < 3) { $("tourErr").textContent = "Give it a name of at least 3 characters."; return; }
    const club = pickVal("tClub"), cl = ON.clubs.find(c => c.id === club);
    const t = { name: name, tc: +pickVal("tTc"), mins: +pickVal("tLen"), start: Date.now() + +pickVal("tStart") * 60000, by: ON.uid, byName: ON.me.name,
      club: club, clubName: cl ? cl.name : "", created: Date.now() };
    $("tourErr").textContent = "Creating...";
    try {
      const tid = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      await ON.db.doc("tours/" + tid).set(t);
      ON.tours.push(Object.assign({ id: tid }, t));
      await joinTour(tid);
      tourPage(tid);
    } catch (x) { $("tourErr").textContent = "Couldn't create it. Try again."; }
  };
}
async function myEntryDoc() {
  const s = await ON.db.doc("tourentries/" + ON.uid).get();
  const d = s.exists ? JSON.parse(JSON.stringify(s.data())) : { name: ON.me.name, tids: [], e: {} };
  d.tids = Array.isArray(d.tids) ? d.tids : []; d.e = d.e || {}; d.name = ON.me.name;
  return d;
}
async function saveEntry(d) {
  d.tids = d.tids.slice(-40);
  await ON.db.doc("tourentries/" + ON.uid).set(d);
  const i = ON.entries.findIndex(x => x.id === ON.uid);
  if (i >= 0) ON.entries[i] = Object.assign({ id: ON.uid }, d); else ON.entries.push(Object.assign({ id: ON.uid }, d));
}
async function joinTour(tid) {
  const d = await myEntryDoc();
  if (!d.tids.includes(tid)) d.tids.push(tid);
  d.e[tid] = d.e[tid] || { score: 0, played: 0, w: 0, d: 0, l: 0, games: [] };
  await saveEntry(d);
}
async function leaveTour(tid) {
  const d = await myEntryDoc();
  d.tids = d.tids.filter(x => x !== tid); delete d.e[tid];
  await saveEntry(d);
}
async function recordTour(gid, g) {
  if (!g.tour || g.reason === "abort" || !g.result || !ON.me) return;
  let t = ON.tours.find(x => x.id === g.tour);
  if (!t) { const s = await ON.db.doc("tours/" + g.tour).get().catch(() => null); if (!s || !s.exists) return; t = Object.assign({ id: g.tour }, s.data()); }
  if ((g.created || 0) > tourEnd(t)) return;
  const d = await myEntryDoc(), e = Object.assign({ score: 0, played: 0, w: 0, d: 0, l: 0, games: [] }, d.e[g.tour]);
  e.games = Array.isArray(e.games) ? e.games : [];
  if (e.games.includes(gid)) return;
  const col = g.white === ON.uid ? "w" : "b", sc = g.result === "½-½" ? 0.5 : g.result === (col === "w" ? "1-0" : "0-1") ? 1 : 0;
  e.score += sc; e.played++; if (sc === 1) e.w++; else if (sc === 0.5) e.d++; else e.l++;
  e.games = e.games.concat(gid).slice(-150);
  if (!d.tids.includes(g.tour)) d.tids.push(g.tour);
  d.e[g.tour] = e;
  await saveEntry(d);
}
async function findTourGame(tid) {
  const t = ON.tours.find(x => x.id === tid);
  if (!t || tourState(t) !== "live" || ON.finding) return;
  ON.finding = true;
  try {
    const cands = freshSeeks().filter(s => s.tour === tid && s.uid !== ON.uid && !s.to);
    for (const s of cands) if (await claimSeek(s.uid)) return;
    await createSeek(t.tc, { tour: tid });
  } catch (e) { statusEl.textContent = "Couldn't look for a game. Try again."; }
  finally { ON.finding = false; if (tourCur === tid) drawTour(); }
}
function tourPage(tid) {
  boardView(false); mode = "tours"; tourCur = tid; stopTourTimer();
  if (needOnline("Tournaments")) return;
  const t = ON.tours.find(x => x.id === tid);
  if (!t) { toursPage(); return; }
  infoEl.innerHTML = "<button id='backTours'>← All tournaments</button><h1 style='margin-top:14px'>" + esc(t.name) + "</h1>" +
    "<div class='small'>" + esc(t.tc) + " min games · " + esc(t.mins) + " minute arena · created by " + esc(t.byName || "someone") + (t.clubName ? " · " + esc(t.clubName) + " club" : "") + "</div>" +
    "<div id='tourBox' style='margin-top:14px'></div><div class='err' id='tourErr'></div><h3>Standings</h3><div id='standings'></div>";
  $("backTours").onclick = () => toursPage();
  drawTour();
  tourTimer = setInterval(() => { if (mode === "tours" && tourCur === tid) drawTourBox(); else stopTourTimer(); }, 1000);
}
function drawTour() { drawTourBox(); drawStandings(); }
function drawTourBox() {
  const t = ON.tours.find(x => x.id === tourCur), el = $("tourBox");
  if (!t || !el) return;
  const st = tourState(t), joined = tourEntries(t.id).some(e => e.id === ON.uid), seekingHere = ON.seeking && ON.seekTour === t.id;
  if (st === "finished" && seekingHere) stopSeeking();
  let h = "<div class='mecard'><div><div class='small'>" + (st === "upcoming" ? "Starts in" : st === "live" ? "Time left" : "Tournament over") + "</div><div class='rt'>" +
    (st === "upcoming" ? fmtLeft(t.start - Date.now()) : st === "live" ? fmtLeft(tourEnd(t) - Date.now()) : "Final") + "</div></div><div style='text-align:right'>";
  if (st === "finished") {
    const top = tourEntries(t.id)[0];
    h += top ? "<div class='small'>Winner</div><b style='font-family:var(--serif);font-size:22px'>" + esc(top.name) + "</b><div class='small'>" + top.score + " points</div>" : "<div class='small'>No games were played.</div>";
    if (top && top.id === ON.uid && ON.celebratedTour !== t.id) { ON.celebratedTour = t.id; celebrate(true); }
  } else if (!joined) h += "<button class='primary' id='tJoin'>Join tournament</button>";
  else if (st === "upcoming") h += "<div class='small'>You're in. Come back when it starts.</div><button id='tLeave' style='margin-top:6px'>Leave</button>";
  else if (seekingHere) h += "<div class='small'>Looking for an opponent...</div><button id='tCancel' style='margin-top:6px'>Cancel</button>";
  else h += "<button class='primary' id='tFind'>Find my next game</button>";
  el.innerHTML = h + "</div></div>";
  if ($("tJoin")) $("tJoin").onclick = async () => { try { await joinTour(t.id); drawTour(); } catch (e) { $("tourErr").textContent = "Couldn't join. Try again."; } };
  if ($("tLeave")) $("tLeave").onclick = async () => { try { await leaveTour(t.id); drawTour(); } catch (e) {} };
  if ($("tCancel")) $("tCancel").onclick = () => stopSeeking().then(drawTour);
  if ($("tFind")) $("tFind").onclick = () => findTourGame(t.id);
}

// Blocked usernames are names/<lowercase> {uid: "blocked", name, blocked: true}.
const ONLINE_MS = 150000;
const AD = { tab: "overview", presence: [], live: [], banned: [], blockedNames: [], unsubs: [], q: "", wallCid: "", wall: [], msg: "" };
const DOING = { home: "Home page", puzzles: "Solving puzzles", play: "Play menu", offline: "Playing offline", online: "Online lobby", tournaments: "Tournaments",
  clubs: "Clubs", learn: "Learning openings", tactics: "Tactics", games: "Past games", leaderboard: "Leaderboard", training: "Training", analysis: "Analysis board",
  progress: "Progress", settings: "Settings", admin: "Admin panel" };
function doingNow() { return mode === "online" && ON.g && ON.g.status === "active" ? "Playing an online game" : (DOING[currentView] || "Browsing"); }
let lastBeat = 0, lastBeatKey = "";
function beatPresence(force) {
  if (!ON.ready || !ON.db || ON.banned) return;
  const key = doingNow() + "|" + (ON.me ? ON.me.name : "");
  if (key !== lastBeatKey) force = true;
  if (!force && Date.now() - lastBeat < 15000) return;
  lastBeatKey = key;
  if (document.visibilityState === "hidden" && !force) return;
  lastBeat = Date.now();
  ON.db.doc("presence/" + ON.uid).set({ name: ON.me ? ON.me.name : "", elo: ON.me ? ON.me.elo : null, seen: Date.now(), doing: doingNow() }).catch(() => {});
}
setInterval(() => beatPresence(true), 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") beatPresence(true); });

    if (ON.fb) { const s = await ON.db.doc("admins/" + ON.uid).get(); ON.admin = !!s.exists; }

  } catch (e) { ON.admin = false; }
  // anyone: watch whether this account has been blocked
  ON.db.doc("banned/" + ON.uid).onSnapshot(s => {
    const was = ON.banned; ON.banned = !!s.exists && !ON.admin;
    if (ON.banned && !was) {
      ON.err = "This account has been blocked from online play by the site admin.";

const agoT = t => { if (!t) return "never"; const s = Math.max(1, Math.round((Date.now() - t) / 1000)); return s < 60 ? s + "s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };

async function adBlockName(name) {
  name = (name || "").trim();
  if (!/^[A-Za-z0-9_-]{3,16}$/.test(name)) return "Usernames are 3–16 letters, numbers, _ or -.";
  const ref = ON.db.doc("names/" + name.toLowerCase()), s = await ref.get(), d = s.exists ? s.data() : null;
  if (d && d.uid && d.uid !== "blocked") return "Someone already uses that name (" + (d.name || name) + "). Remove or block that player instead.";
  await ref.set({ uid: "blocked", name: name, blocked: true });

  viewIdx = null; gameSnaps = []; marks = { arrows: [], circles: [] }; premove = null;
  stopTourTimer(); tourCur = "";
  if (clubView.postsUnsub) { clubView.postsUnsub(); clubView.postsUnsub = null; } clubView.cid = "";
  navTo(view);
  if (view === "home") homePage();
  else if (view === "puzzles") sectionPuzzle(secIdx, pIdx);
  else if (view === "play") playHub();
  else if (view === "offline") offlineHub();
  else if (view === "tournaments") toursPage();
  else if (view === "clubs") clubsPage();
  else if (view === "learn") learnPage();
  else if (view === "tactics") tacticsPage();
  else if (view === "games") gamesPage();
  else if (view === "online") onlineLobby();
  else if (view === "leaderboard") leaderboardPage();
  else if (view === "training") trainingPage();
  else if (view === "analysis") openAnalysis([], 0);
  else if (view === "progress") progressPage();
  else if (view === "admin") adminPage();
  else settingsPage();
  beatPresence();
}
document.querySelectorAll(".nav-item").forEach(n => n.onclick = () => show(n.dataset.view));
$("logo").onclick = () => show("home");
applyTheme(SET.theme, MONO_SWITCH);
show("home");
onlineInit();

</script>
